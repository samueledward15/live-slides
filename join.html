<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شارك</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/engine.js"></script>
</head>
<body>
<div class="phone">
  <div class="brand"><b id="deckTitle">…</b><span id="pos"></span></div>
  <div id="root"><div class="wait"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
</div>
<script>
// ===== Audience phone: shows the interactive part of the current slide =====
const root = document.getElementById("root");
let deck, cur = -1;
const mine = (() => { try { return JSON.parse(localStorage.getItem("ls_mine_" + LS.session) || "{}"); } catch { return {}; } })();
const saveMine = () => { try { localStorage.setItem("ls_mine_" + LS.session, JSON.stringify(mine)); } catch {} };

const W = {
  poll: (s) => {
    root.innerHTML = `<div class="p-title">${s.question}</div>${s.hint ? `<div class="p-sub">${s.hint}</div>` : ""}
      <div class="opts">${s.options.map((o, i) => `<button class="opt ${mine[s.id] === i ? "sel" : ""}" data-i="${i}">${LS.esc(o)}</button>`).join("")}</div>
      <div class="ok" id="ok">${mine[s.id] !== undefined ? "✓ صوتك اتسجل، وتقدر تغيّره" : ""}</div>`;
    root.querySelectorAll(".opt").forEach((b) => b.onclick = async () => {
      const i = +b.dataset.i;
      root.querySelectorAll(".opt").forEach((x) => x.classList.toggle("sel", x === b));
      const { error } = await LS.submit(s.id, { choice: i });
      document.getElementById("ok").textContent = error ? "حصلت مشكلة، جرّب تاني" : "✓ صوتك اتسجل، وتقدر تغيّره";
      if (!error) { mine[s.id] = i; saveMine(); }
    });
  },
  object: (s) => {
    root.innerHTML = `<div class="p-title">${s.phoneTitle || s.title}</div>
      <div class="obj-img p-obj"><img class="p-img" src="${s.image}" alt="">${(s.points || []).map((p, i) => p.x == null ? "" : `<span class="hot" style="left:${p.x}%;top:${p.y}%">${LS.ar(i + 1)}</span>`).join("")}</div>
      ${(s.points || []).length ? `<ol class="pts">${s.points.map((p, i) => `<li><span class="pn">${LS.ar(i + 1)}</span><span>${p.text}</span></li>`).join("")}</ol>` : ""}
      ${s.phoneText ? `<div class="p-sub">${s.phoneText}</div>` : ""}`;
  },
  // Before/after with ask:true: phones answer the "after" poll right on the compare slide
  compare: (s) => { const src = deck.slides.find((x) => x.id === s.from[0]);
    if (!s.ask || !src) return W._passive(s);
    W.poll({ ...src, id: s.from[1], hint: s.hint || "جاوب تاني بعد ما شفت العرض." }); },
  // ===== Phase 2 =====
  cloud: (s) => {
    const max = s.max || 3, mineW = (mine[s.id] || []).slice();
    const draw = () => {
      root.innerHTML = `<div class="p-title">${s.question}</div><div class="p-sub">${s.hint || `اكتب لحد ${LS.ar(max)} كلمات، كل كلمة لوحدها.`}</div>
        <form class="cl-form" id="f"><input id="w" maxlength="30" placeholder="كلمة واحدة" autocomplete="off" ${mineW.length >= max ? "disabled" : ""}><button class="opt send" ${mineW.length >= max ? "disabled" : ""}>ابعت</button></form>
        <div class="chips">${mineW.map((w, i) => `<span class="chip">${LS.esc(w)}<button data-i="${i}" aria-label="امسح">×</button></span>`).join("")}</div>
        <div class="ok" id="ok"></div>`;
      const save = async () => { const { error } = await LS.submit(s.id, { words: mineW });
        document.getElementById("ok").textContent = error ? "حصلت مشكلة، جرّب تاني" : "✓ وصلت"; if (!error) { mine[s.id] = mineW; saveMine(); } };
      document.getElementById("f").onsubmit = async (e) => { e.preventDefault(); const v = document.getElementById("w").value.trim().split(/\s+/)[0];
        if (!v || mineW.length >= max) return; mineW.push(v); draw(); await save(); };
      root.querySelectorAll(".chip button").forEach((b) => b.onclick = async () => { mineW.splice(+b.dataset.i, 1); draw(); await save(); });
    };
    draw();
  },
  tap: (s) => {
    root.innerHTML = `<div class="p-title">${s.question}</div><div class="p-sub">${s.phoneHint || "دوس على المكان في الصورة، وتقدر تغيّره."}</div>
      <div class="tap-phone" id="tp"><img src="${s.image}" alt="">${mine[s.id] ? `<i style="left:${mine[s.id].x}%;top:${mine[s.id].y}%"></i>` : ""}</div><div class="ok" id="ok"></div>`;
    const box = document.getElementById("tp");
    box.onclick = async (e) => {
      const r = box.getBoundingClientRect(), v = { x: Math.round((e.clientX - r.left) / r.width * 1000) / 10, y: Math.round((e.clientY - r.top) / r.height * 1000) / 10 };
      box.querySelector("i")?.remove(); box.insertAdjacentHTML("beforeend", `<i style="left:${v.x}%;top:${v.y}%"></i>`);
      const { error } = await LS.submit(s.id, v);
      document.getElementById("ok").textContent = error ? "حصلت مشكلة، جرّب تاني" : "✓ نقطتك اتسجلت";
      if (!error) { mine[s.id] = v; saveMine(); }
    };
  },
  scale: (s) => {
    const n = s.steps || 5, L = s.labels || ["لا أوافق", "أوافق تمامًا"];
    root.innerHTML = `<div class="p-title">${s.question}</div>
      <div class="scale-btns">${Array.from({ length: n }, (_, i) => `<button class="opt sc ${mine[s.id] === i + 1 ? "sel" : ""}" data-v="${i + 1}">${LS.ar(i + 1)}</button>`).join("")}</div>
      <div class="sl-p"><span>${L[0]}</span><span>${L[1]}</span></div><div class="ok" id="ok">${mine[s.id] ? "✓ رأيك اتسجل، وتقدر تغيّره" : ""}</div>`;
    root.querySelectorAll(".sc").forEach((b) => b.onclick = async () => {
      const v = +b.dataset.v; root.querySelectorAll(".sc").forEach((x) => x.classList.toggle("sel", x === b));
      const { error } = await LS.submit(s.id, { v });
      document.getElementById("ok").textContent = error ? "حصلت مشكلة، جرّب تاني" : "✓ رأيك اتسجل، وتقدر تغيّره";
      if (!error) { mine[s.id] = v; saveMine(); }
    });
  },
  qa: (s) => {
    const myVotes = mine[s.id + ":votes"] || {};
    root.innerHTML = `<div class="p-title">${s.phoneTitle || "اسأل المحاضر"}</div>
      <form class="qa-form" id="f"><textarea id="q" maxlength="200" rows="3" placeholder="اكتب سؤالك هنا…"></textarea><button class="opt send">ابعت السؤال</button></form>
      <div class="ok" id="ok"></div><div class="p-sub" style="margin-top:18px">اعمل لايك على الأسئلة اللي عايز إجابتها:</div><div class="qa-list" id="ql"></div>`;
    const list = async () => {
      const [rows, mod] = await Promise.all([LS.getResponsesLike(s.id), LS.getMod(s.id)]);
      const hide = new Set(mod.filter((m) => m.kind === "hide").map((m) => m.item)), done = new Set(mod.filter((m) => m.kind === "answered").map((m) => m.item));
      const votes = {}; rows.filter((r) => r.slide_id.startsWith(s.id + ":v:") && r.value.up).forEach((r) => { const q = r.slide_id.split(":v:")[1]; votes[q] = (votes[q] || 0) + 1; });
      const qs = rows.filter((r) => r.slide_id.startsWith(s.id + ":q:")).map((r) => ({ id: r.slide_id.split(":q:")[1], text: r.value.text }))
        .filter((q) => q.text && !hide.has(q.id)).map((q) => ({ ...q, v: votes[q.id] || 0, done: done.has(q.id) })).sort((a, b) => a.done - b.done || b.v - a.v);
      const el = document.getElementById("ql"); if (!el) return;
      el.innerHTML = qs.map((q) => `<div class="qa-item${q.done ? " done" : ""}"><span>${LS.esc(q.text)}</span>
        <button class="vote ${myVotes[q.id] ? "sel" : ""}" data-q="${q.id}" ${q.done ? "disabled" : ""}>▲ ${LS.ar(q.v)}</button></div>`).join("") || `<div class="p-sub">لسه مفيش أسئلة.</div>`;
      el.querySelectorAll(".vote").forEach((b) => b.onclick = async () => {
        const q = b.dataset.q, up = myVotes[q] ? 0 : 1;
        const { error } = await LS.submit(`${s.id}:v:${q}`, { up });
        if (!error) { myVotes[q] = up; mine[s.id + ":votes"] = myVotes; saveMine(); list(); }
      });
    };
    document.getElementById("f").onsubmit = async (e) => { e.preventDefault(); const t = document.getElementById("q").value.trim(); if (t.length < 3) return;
      const { error } = await LS.submit(`${s.id}:q:${LS.rid()}`, { text: t });
      document.getElementById("ok").textContent = error ? "حصلت مشكلة، جرّب تاني" : "✓ سؤالك وصل";
      if (!error) { document.getElementById("q").value = ""; list(); } };
    list(); W._live = () => list();
  },
  _passive: (s) => {
    root.innerHTML = `<div class="p-title">${s.phoneTitle || s.title || s.question || ""}</div>
      <div class="p-sub">${s.phoneText || "تابع الشاشة… أول ما يجي سؤال هيظهرلك هنا."}</div>
      ${s.image && s.showImageOnPhone !== false ? `<img class="p-img" src="${s.image}" alt="">` : ""}
      <div class="wait"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  },
};

function show(i) {
  if (!deck || i === cur || i < 0 || i >= deck.slides.length) return;
  cur = i; const s = deck.slides[i];
  document.getElementById("pos").textContent = `${LS.ar(i + 1)} / ${LS.ar(deck.slides.length)}`;
  W._live = null; (W[s.type] && !s.type.startsWith("_") ? W[s.type] : W._passive)(s);
  if (navigator.vibrate && (["poll", "cloud", "tap", "scale", "qa"].includes(s.type) || (s.type === "compare" && s.ask))) navigator.vibrate(30);
}

(async () => {
  try {
    deck = await LS.loadDeck();
    document.getElementById("deckTitle").textContent = deck.title;
    if (deck.logoSmall || deck.logo) document.querySelector(".brand").insertAdjacentHTML("afterbegin", `<img src="${deck.logoSmall || deck.logo}" alt="">`);
    show(await LS.getState());
    LS.subscribe({ onSlide: show, onResponse: (id) => { const s = deck.slides[cur]; if (s && s.type === "qa" && id && (id === s.id || id.startsWith(s.id + ":")) && W._live) W._live(); } });
  } catch (e) { root.innerHTML = `<div class="err">العرض ده مش موجود أو الرابط ناقص.</div>`; }
})();
</script>
</body>
</html>
