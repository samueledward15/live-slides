<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحكم</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/assets/engine.js"></script>
</head>
<body>
<div class="ctl">
  <h1 id="deckTitle">الريموت</h1>
  <div class="ctimer" id="ct" hidden><b id="ctT">٥:٠٠</b><span id="ctPace"></span>
    <div class="ctb"><button class="btn small" id="tStart">ابدأ</button><button class="btn small" id="tPause">إيقاف مؤقت</button><button class="btn small" id="tReset">من الأول</button></div></div>
  <div class="now"><div class="n" id="n"></div><div class="t" id="t"></div><div class="notes" id="notes"></div></div>
  <div class="nav">
    <button class="btn" id="prev">→ السابقة</button>
    <button class="btn primary" id="next">التالية ←</button>
  </div>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn small" id="reset" hidden>صفّر نتايج التصويت ده</button>
    <a class="btn small" id="openScreen" target="_blank">افتح الشاشة</a>
  </div>
  <div class="err" id="err"></div>
  <div class="modp" id="modp" hidden></div>
  <div class="list" id="list"></div>
</div>
<script>
// ===== Presenter remote (phone). Needs ?k=<presenter key> =====
let deck, cur = 0;
const $ = (id) => document.getElementById(id);
const label = (s) => (s.title || s.question || "").replace(/<[^>]+>/g, " ");

function render() {
  const s = deck.slides[cur];
  $("n").textContent = `شريحة ${LS.ar(cur + 1)} من ${LS.ar(deck.slides.length)} · ${s.type}`;
  $("t").textContent = label(s);
  $("notes").textContent = (s.sec ? `⏱ ${LS.ar(s.sec)} ث · ` : "") + (s.notes || "");
  $("reset").hidden = !["poll", "cloud", "tap", "scale", "qa"].includes(s.type);
  $("reset").textContent = s.type === "qa" ? "امسح كل الأسئلة" : "صفّر نتايج الشريحة دي";
  modPanel();
  $("list").innerHTML = deck.slides.map((x, i) => `<button class="${i === cur ? "cur" : ""}" data-i="${i}">${LS.ar(i + 1)}. ${LS.esc(label(x))}</button>`).join("");
  $("list").querySelectorAll("button").forEach((b) => b.onclick = () => go(+b.dataset.i));
}
// ---- moderation panel: hide words / questions, mark answered, reveal tap answer
async function modPanel() {
  const s = deck.slides[cur], el = $("modp");
  if (!["cloud", "qa", "tap"].includes(s.type)) { el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  const mod = await LS.getMod(s.id); const has = (item, kind) => mod.some((m) => m.item === item && m.kind === kind);
  let rows = [];
  if (s.type === "tap") {
    rows = s.answer ? [`<button class="btn small mbtn ${has("reveal", "answered") ? "on" : ""}" data-i="reveal" data-k="answered">${has("reveal", "answered") ? "اخفي الإجابة" : "اكشف الإجابة"}</button>`] : [];
  } else if (s.type === "cloud") {
    const m = new Map(); (await LS.getResponses(s.id)).forEach((v) => (v.words || []).forEach((w) => { const k = LS.norm(w); if (k) m.set(k, (m.get(k) || { w, n: 0 })), m.get(k).n++; }));
    rows = [...m.entries()].sort((a, b) => b[1].n - a[1].n).map(([k, x]) =>
      `<div class="mrow"><span>${LS.esc(x.w)} · ${LS.ar(x.n)}</span><button class="btn small mbtn ${has(k, "hide") ? "on" : ""}" data-i="${LS.esc(k)}" data-k="hide">${has(k, "hide") ? "إظهار" : "إخفاء"}</button></div>`);
  } else {
    const r = await LS.getResponsesLike(s.id);
    rows = r.filter((x) => x.slide_id.startsWith(s.id + ":q:")).map((x) => ({ id: x.slide_id.split(":q:")[1], t: x.value.text })).map((q) =>
      `<div class="mrow"><span>${LS.esc(q.t)}</span><button class="btn small mbtn ${has(q.id, "answered") ? "on" : ""}" data-i="${q.id}" data-k="answered">${has(q.id, "answered") ? "رجّعه" : "اتجاوب"}</button>
       <button class="btn small mbtn ${has(q.id, "hide") ? "on" : ""}" data-i="${q.id}" data-k="hide">${has(q.id, "hide") ? "إظهار" : "إخفاء"}</button></div>`);
  }
  el.innerHTML = `<div class="n">${s.type === "tap" ? "الإجابة" : s.type === "cloud" ? "الكلمات" : "الأسئلة"}</div>${rows.join("") || `<div class="notes">لسه مفيش حاجة.</div>`}`;
  el.querySelectorAll(".mbtn").forEach((b) => b.onclick = async () => { await LS.moderate(s.id, b.dataset.i, b.dataset.k, !b.classList.contains("on")); modPanel(); });
}

async function go(i) {
  if (i < 0 || i >= deck.slides.length) return;
  const { error } = await LS.setSlide(i);
  $("err").textContent = error ? "المفتاح غلط أو فيه مشكلة في النت." : "";
  if (!error) { cur = i; render(); }
}

(async () => {
  if (!LS.key) { $("err").textContent = "لازم تفتح الصفحة دي باللينك اللي فيه المفتاح."; return; }
  deck = await LS.loadDeck();
  $("deckTitle").textContent = deck.title;
  $("openScreen").href = `/screen?s=${encodeURIComponent(LS.session)}&k=${encodeURIComponent(LS.key)}`;
  cur = await LS.getState(); render();
  // timer + pacing: slide budgets (sec) add up to deck.duration
  let resync = null;
  if (deck.duration) {
    $("ct").hidden = false;
    const ends = []; deck.slides.reduce((a, x, i) => (ends[i] = a + (x.sec || 0)), 0);
    resync = LS.watchTimer((el, running) => {
      const left = deck.duration - el;
      $("ctT").textContent = (left < 0 ? "+" : "") + LS.clock(left);
      $("ct").className = "ctimer" + (left <= 0 ? " over" : left <= 60 ? " warn" : "");
      const want = ends.findIndex((e) => e > el), target = want < 0 ? deck.slides.length - 1 : want;
      const lag = cur - target;
      $("ctPace").textContent = !running && el === 0 ? "بيبدأ لوحده أول ما تعدّي الغلاف" :
        lag === 0 ? "ماشي في الوقت ✓" : lag < 0 ? `متأخر ${LS.ar(-lag)} شريحة · المفروض تكون في ${LS.ar(target + 1)}` : `قدّام بـ${LS.ar(lag)} شريحة`;
      $("ctPace").className = lag < 0 ? "late" : "";
    });
    $("tStart").onclick = () => LS.timerCtl("start");
    $("tPause").onclick = () => LS.timerCtl("pause");
    $("tReset").onclick = () => { if (confirm("ترجّع التايمر للصفر؟")) LS.timerCtl("reset"); };
  }
  LS.subscribe({ onTimer: () => resync && resync(), onSlide: (i) => { cur = i; render(); },
    onResponse: (id) => { const s = deck.slides[cur]; if (s && id && (id === s.id || id.startsWith(s.id + ":"))) modPanel(); } });
  $("next").onclick = () => go(cur + 1);
  $("prev").onclick = () => go(cur - 1);
  $("reset").onclick = async () => { if (confirm("تمسح كل ردود الشريحة دي؟")) await LS.resetSlide(deck.slides[cur].id); };
})();
</script>
</body>
</html>
