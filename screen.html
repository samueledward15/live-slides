<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>العرض</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/assets/engine.js"></script>
</head>
<body>
<div class="stage-wrap"><div class="stage" id="stage"><div class="frame"></div><div id="root"></div><div class="talk-timer" id="tt" hidden><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5"/><circle id="ttArc" cx="18" cy="18" r="15.5"/></svg><b id="ttTxt"></b></div></div></div>
<div class="hint" id="hint"></div>
<script>
// ===== Projector screen: follows the session; with ?k= it can also be driven by keyboard =====
const stage = document.getElementById("stage"), root = document.getElementById("root");
let deck, cur = -1;

// Scale the fixed 1600x900 stage to the window
const fit = () => { const s = Math.min(innerWidth / 1600, innerHeight / 900); stage.style.transform = `translate(-50%,-50%) scale(${s})`; };
addEventListener("resize", fit); fit();

const qr = (el, size) => { el.innerHTML = ""; new QRCode(el, { text: LS.joinUrl(), width: size, height: size, correctLevel: QRCode.CorrectLevel.M }); };

// ---- slide renderers (one per type)
// small helpers shared by the layouts
const K = (s) => s.kicker ? `<div class="kicker">${s.kicker}</div>` : "";
const B = (s) => s.body ? `<div class="body">${s.body}</div>` : "";
const UL = (items, cls = "") => items && items.length ? `<ul class="lst ${cls}">${items.map((x) => `<li>${x}</li>`).join("")}</ul>` : "";
const CITE = (s) => s.cite ? `<div class="cite">${s.cite}</div>` : "";
const IMG = (src, cls, s = {}, extra = "") => src ? `<img class="ph ${cls}" src="${src}" alt="${LS.esc(s.alt || "")}"${s.pos ? ` style="object-position:${s.pos}${extra}"` : (extra ? ` style="${extra.slice(1)}"` : "")}>` : "";
const HEAD = (s) => `${K(s)}<div class="title">${s.title}</div>${s.sub ? `<div class="sub">${s.sub}</div>` : ""}<div class="rule"></div>`;

const R = {
  // Cover: header line, animated logo, title, author, photo rising from the bottom edge
  title: (s) => {
    const logo = s.logo !== false && deck.logo ? `<img class="logo" src="${deck.logo}${deck.logo.endsWith(".svg") ? "?t=" + Date.now() : ""}" alt="">` : "";
    const hd = s.header ? `<div class="hd">${s.header.map((h) => `<span>${h}</span>`).join("")}</div>` : "";
    return `${hd}<div class="cover">${logo}${K(s)}<div class="title xl">${s.title}</div>${s.subtitle ? `<div class="subtitle">${s.subtitle}</div>` : ""}</div>
      ${IMG(s.image, "rise", s)}<div class="braid"></div>`;
  },
  // Section divider: centred title with the Coptic braid as divider
  section: (s) => `<div class="cover">${K(s)}<div class="title xl">${s.title}</div><div class="braid inline"></div>${s.subtitle ? `<div class="subtitle">${s.subtitle}</div>` : ""}</div>`,
  // Closing: logo, title, rule
  end: (s) => `<div class="cover">${deck.logoStatic ? `<img class="logo" src="${deck.logoStatic}" alt="">` : ""}<div class="title xl">${s.title}</div><div class="rule c"></div>
      ${s.subtitle ? `<div class="subtitle">${s.subtitle}</div>` : ""}</div><div class="braid"></div>`,
  // Two columns: idea on the right, list + citation on the left
  text: (s) => `<div class="lay-text"><div>${HEAD(s)}${B(s)}</div><div>${s.listTitle ? `<div class="lt">${s.listTitle}</div>` : ""}${UL(s.list)}${CITE(s)}</div></div>`,
  // Photo pair: tall piece + detail crop under the text, list and museum label at the side
  pair: (s) => `<div class="lay-pair">${IMG(s.image, "big", s)}<div class="mid">${HEAD(s)}${B(s)}${IMG(s.detail, "det", { pos: s.detailPos })}</div>
      <div class="side">${UL(s.list)}${s.credit ? `<div class="credit">${s.credit}</div>` : ""}</div></div>`,
  // Half-bleed: photo fills the left half, text on the right
  half: (s) => `${IMG(s.image, "halfimg", s)}<div class="lay-half">${HEAD(s)}${B(s)}${UL(s.list)}${s.credit ? `<div class="credit">${s.credit}</div>` : ""}</div>`,
  // Band: text and list on top, wide photo bleeding off the bottom
  band: (s) => `<div class="lay-band"><div>${HEAD(s)}${B(s)}</div><div>${s.listTitle ? `<div class="lt">${s.listTitle}</div>` : ""}${UL(s.list)}</div></div>
      ${IMG(s.image, "bandimg", s)}${s.credit ? `<div class="credit on-img">${s.credit}</div>` : ""}`,
  // Photo with a tinted note overlapping its bottom edge
  note: (s) => `<div class="lay-note"><div>${HEAD(s)}${B(s)}${UL(s.list, s.list && s.list.length > 3 ? "two" : "")}</div>
      <figure>${IMG(s.image, "noteimg", s)}${s.note ? `<figcaption class="note">${s.note}</figcaption>` : ""}</figure></div>`,
  // Timeline: items [{title, sub, color}] laid on a wavy band
  timeline: (s) => {
    const n = s.items.length, W = 1360, H = 430, ys = s.items.some((x) => x.img) ? [175, 255] : [150, 300];
    const pts = s.items.map((_, i) => [W - (i + 0.5) * W / n, ys[i % 2]]);
    let d = `M ${W} ${H / 2}`; pts.forEach(([x, y]) => { d += ` S ${x + W / n / 2} ${y} ${x} ${y}`; }); d += ` S 0 ${H / 2} 0 ${H / 2}`;
    const cols = ["var(--wine)", "var(--crimson)", "var(--gold-deep)", "var(--teal)", "var(--terra)", "var(--gold)"];
    return `${K(s)}<div class="title">${s.title}</div>
      <div class="tl"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="14" stroke-linecap="round"/>
        <path d="${d}" fill="none" stroke="var(--gold)" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18"/></svg>
      ${s.items.map((it, i) => `<div class="node ${i % 2 ? "" : "up"}" style="right:${(i + 0.5) / n * 100}%;top:${pts[i][1] / H * 100}%">
        <div class="dot" style="background:${it.color || cols[i % cols.length]}">${LS.ar(i + 1)}</div>
        <div class="lbl">${it.img ? `<img class="th" src="${it.img}" alt=""${it.pos ? ` style="object-position:${it.pos}"` : ""}>` : ""}${it.title}${it.sub ? `<div class="sub">${it.sub}</div>` : ""}</div></div>`).join("")}</div>`;
  },
  content: (s) => s.image
      ? `<div class="split"><div>${K(s)}<div class="title">${s.title}</div>
           ${B(s)}</div>
           <div><img src="${s.image}" alt=""><div class="cap">${LS.esc(s.caption || "")}</div></div></div>`
      : `${K(s)}<div class="title">${s.title}</div>${B(s)}`,
  join: (s) => `<div class="join"><div>${K(s.kicker ? s : { kicker: "شارك معانا" })}<div class="title">${s.title}</div><div class="rule"></div>
                 <div class="subtitle">${s.subtitle || "امسح الكود بكاميرا الموبايل"}</div><div class="url">${LS.joinUrl().replace(/^https?:\/\//, "")}</div></div>
                 <div class="qr" id="bigqr"></div></div>`,
  // Museum object: photo with numbered look-points + catalogue label
  object: (s) => {
    const M = s.museum || {}, rows = [["المتحف", M.name], ["رقم القيد", M.inv], ["التاريخ", M.date], ["المادة", M.material], ["المصدر", M.place]].filter((r) => r[1]);
    const pts = s.points || [];
    return `<div class="obj${s.wide ? " wide" : ""}"><div class="obj-text"><div class="oh">${HEAD(s)}</div><div class="ob">
        ${pts.length ? `<ol class="pts">${pts.map((p, i) => `<li style="--i:${i}"><span class="pn">${LS.ar(i + 1)}</span><span>${p.text}</span></li>`).join("")}</ol>` : B(s)}
        ${rows.length ? `<dl class="tag">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${LS.esc(v)}</dd></div>`).join("")}</dl>` : ""}</div></div>
      <figure class="obj-fig"><div class="obj-img"><img src="${s.image}" alt="${LS.esc(s.alt || "")}">
        ${pts.map((p, i) => p.x == null ? "" : `<span class="hot" style="left:${p.x}%;top:${p.y}%;--i:${i}">${LS.ar(i + 1)}</span>`).join("")}</div>
        ${s.caption ? `<figcaption class="cap">${LS.esc(s.caption)}</figcaption>` : ""}</figure></div>`;
  },
  // ===== Phase 2 =====
  // Word cloud: each phone sends up to s.max words; size grows with count
  cloud: (s) => `<div class="miniqr" id="miniqr"></div>${K(s.kicker ? s : { kicker: "شارك بكلمة" })}<div class="q">${s.question}</div>
                 <div class="cloud" id="cloud"></div><div class="total" id="tot"></div>`,
  // Tap on image: every phone drops one point; presenter can reveal the answer ring
  tap: (s) => `<div class="miniqr" id="miniqr"></div><div class="lay-tap"><div>${K(s.kicker ? s : { kicker: "دوس على الصورة" })}<div class="q">${s.question}</div>
                 ${s.hint ? `<div class="body">${s.hint}</div>` : ""}<div class="total" id="tot"></div><div class="reveal" id="reveal"></div></div>
                 <div class="tap-img" id="tapimg"><img src="${s.image}" alt="${LS.esc(s.alt || "")}"><div id="dots"></div>
                 ${s.answer ? `<span class="ring" id="ring" style="left:${s.answer.x}%;top:${s.answer.y}%;width:${(s.answer.r || 8) * 2}%"></span>` : ""}</div></div>`,
  // Agreement scale 1..n: distribution bars + average
  scale: (s) => { const n = s.steps || 5, L = s.labels || ["لا أوافق", "أوافق تمامًا"];
    return `<div class="miniqr" id="miniqr"></div>${K(s.kicker ? s : { kicker: "رأيك" })}<div class="q">${s.question}</div>
      <div class="lay-scale"><div class="avg"><b id="avg">–</b><span>المتوسط من ${LS.ar(n)}</span></div>
      <div class="sbars">${Array.from({ length: n }, (_, i) => `<div class="sb"><div class="sbt"><div class="sbf" id="s${i}"></div></div><b id="sn${i}">٠</b><span>${LS.ar(i + 1)}</span></div>`).join("")}</div></div>
      <div class="sl"><span>${LS.ar(1)} = ${L[0]}</span><span>${LS.ar(n)} = ${L[1]}</span></div><div class="total" id="tot"></div>`; },
  // Before / after: two poll slides side by side (s.from = [idBefore, idAfter])
  compare: (s) => { const src = deck.slides.find((x) => x.id === s.from[0]) || { options: [] }, lb = s.labels || ["قبل", "بعد"];
    return `${K(s.kicker ? s : { kicker: "قبل وبعد" })}<div class="q">${s.title || src.question}</div>
      <div class="cmp-key"><span class="k0">${lb[0]}</span><span class="k1">${lb[1]}</span></div>
      <div class="cmp">${src.options.map((o, i) => `<div class="cr"><div class="co">${LS.esc(o)}</div>
        <div class="cb"><div class="ct"><div class="cf c0" id="c0-${i}"></div></div><b id="cn0-${i}">٠٪</b></div>
        <div class="cb"><div class="ct"><div class="cf c1" id="c1-${i}"></div></div><b id="cn1-${i}">٠٪</b></div></div>`).join("")}</div>
      <div class="total" id="tot"></div>`; },
  // Quote: big quotation with its source
  quote: (s) => `<div class="lay-quote">${K(s)}<blockquote>${s.quote}</blockquote><div class="rule c"></div><div class="cite">${s.cite || ""}</div></div>`,
  // Q&A: audience questions sorted by votes; answered ones drop to the bottom
  qa: (s) => `<div class="miniqr" id="miniqr"></div>${K(s.kicker ? s : { kicker: "أسئلتكم" })}<div class="q">${s.title || "اسأل من موبايلك"}</div>
              <div class="qa" id="qa"></div><div class="total" id="tot"></div>`,
  poll: (s) => `<div class="miniqr" id="miniqr"></div>${K(s.kicker ? s : { kicker: "تصويت" })}<div class="q">${s.question}</div>
                <div class="bars">${s.options.map((o, i) => `<div class="bar"><div>${LS.esc(o)}</div><div class="track"><div class="fill" id="f${i}"></div></div><div class="num" id="n${i}">٠</div></div>`).join("")}</div>
                <div class="total" id="tot"></div>`,
};

const mini = (label) => { const m = document.getElementById("miniqr"); if (!m) return; qr(m, 120); m.insertAdjacentHTML("beforeend", `<span>${label}</span>`); };
const after = {
  join: () => qr(document.getElementById("bigqr"), 380),
  cloud: (s) => { mini("اكتب"); refresh(s); },
  tap: (s) => { mini("دوس"); refresh(s); },
  scale: (s) => { mini("قيّم"); refresh(s); },
  compare: (s) => refresh(s),
  qa: (s) => { mini("اسأل"); refresh(s); },
  poll: (s) => { qr(document.getElementById("miniqr"), 120); document.getElementById("miniqr").insertAdjacentHTML("beforeend", "<span>صوّت</span>"); refreshPoll(s); },
};

// ---- live refresh for phase-2 slides
const hiddenSet = (mod) => new Set(mod.filter((m) => m.kind === "hide").map((m) => m.item));
const PALETTE = ["var(--wine)", "var(--crimson)", "var(--gold-deep)", "var(--teal)", "var(--terra)"];
const R2 = {
  cloud: async (s) => {
    const [vals, mod] = await Promise.all([LS.getResponses(s.id), LS.getMod(s.id)]); const hide = hiddenSet(mod);
    const m = new Map(); vals.forEach((v) => (v.words || []).forEach((w) => { const k = LS.norm(w); if (!k || hide.has(k)) return;
      const e = m.get(k) || { w: String(w).trim(), n: 0 }; e.n++; m.set(k, e); }));
    const list = [...m.values()].sort((a, b) => b.n - a.n).slice(0, 40), max = Math.max(1, ...list.map((x) => x.n));
    // biggest word in the middle: alternate placement around the centre
    const order = []; list.forEach((x, i) => (i % 2 ? order.push(x) : order.unshift(x)));
    const el = document.getElementById("cloud"); if (!el) return;
    el.innerHTML = order.map((x, i) => `<span style="font-size:${30 + 70 * Math.sqrt(x.n / max)}px;color:${PALETTE[(list.indexOf(x)) % PALETTE.length]}">${LS.esc(x.w)}</span>`).join("")
      || `<span class="empty">مستنيين أول كلمة…</span>`;
    document.getElementById("tot").textContent = `عدد المشاركين: ${LS.ar(vals.length)}`;
  },
  tap: async (s) => {
    const [vals, mod] = await Promise.all([LS.getResponses(s.id), LS.getMod(s.id)]);
    const d = document.getElementById("dots"); if (!d) return;
    d.innerHTML = vals.filter((v) => typeof v.x === "number").map((v) => `<i style="left:${v.x}%;top:${v.y}%"></i>`).join("");
    document.getElementById("tot").textContent = `عدد النقط: ${LS.ar(vals.length)}`;
    const shown = mod.some((m) => m.kind === "answered" && m.item === "reveal");
    const ring = document.getElementById("ring"); if (ring) ring.classList.toggle("on", shown);
    if (s.answer) { const inside = vals.filter((v) => Math.hypot(v.x - s.answer.x, (v.y - s.answer.y)) <= (s.answer.r || 8)).length;
      document.getElementById("reveal").innerHTML = shown ? `${s.answerText ? `<div class="body">${s.answerText}</div>` : ""}<b>${LS.ar(inside)}</b> من ${LS.ar(vals.length)} داسوا صح` : ""; }
  },
  scale: async (s) => {
    const n = s.steps || 5, vals = (await LS.getResponses(s.id)).map((v) => v.v).filter((v) => v >= 1 && v <= n);
    const c = Array(n).fill(0); vals.forEach((v) => c[v - 1]++); const max = Math.max(1, ...c);
    c.forEach((v, i) => { const f = document.getElementById("s" + i); if (f) f.style.height = (v / max * 100) + "%"; const b = document.getElementById("sn" + i); if (b) b.textContent = LS.ar(v); });
    const a = vals.length ? vals.reduce((x, y) => x + y, 0) / vals.length : 0;
    document.getElementById("avg").textContent = vals.length ? LS.ar(a.toFixed(1)).replace(".", "٫") : "–";
    document.getElementById("tot").textContent = `عدد المشاركين: ${LS.ar(vals.length)}`;
  },
  compare: async (s) => {
    const src = deck.slides.find((x) => x.id === s.from[0]); if (!src) return; const k = src.options.length;
    const sets = await Promise.all(s.from.map((id) => LS.getResponses(id)));
    sets.forEach((vals, j) => { const c = LS.tally(vals, k), t = Math.max(1, c.reduce((a, b) => a + b, 0));
      c.forEach((v, i) => { const p = Math.round(v / t * 100); const f = document.getElementById(`c${j}-${i}`); if (f) f.style.width = p + "%";
        const b = document.getElementById(`cn${j}-${i}`); if (b) b.textContent = LS.ar(p) + "٪"; }); });
    document.getElementById("tot").textContent = `المشاركين: ${LS.ar(sets[0].length)} قبل · ${LS.ar(sets[1].length)} بعد`;
  },
  qa: async (s) => {
    const [rows, mod] = await Promise.all([LS.getResponsesLike(s.id), LS.getMod(s.id)]); const hide = hiddenSet(mod);
    const done = new Set(mod.filter((m) => m.kind === "answered").map((m) => m.item));
    const votes = {}; rows.filter((r) => r.slide_id.startsWith(s.id + ":v:") && r.value.up).forEach((r) => { const q = r.slide_id.split(":v:")[1]; votes[q] = (votes[q] || 0) + 1; });
    const qs = rows.filter((r) => r.slide_id.startsWith(s.id + ":q:")).map((r) => ({ id: r.slide_id.split(":q:")[1], text: r.value.text, t: r.created_at }))
      .filter((q) => q.text && !hide.has(q.id))
      .map((q) => ({ ...q, v: votes[q.id] || 0, done: done.has(q.id) }))
      .sort((a, b) => a.done - b.done || b.v - a.v || (a.t < b.t ? -1 : 1));
    const el = document.getElementById("qa"); if (!el) return;
    el.innerHTML = qs.slice(0, 6).map((q) => `<div class="qq${q.done ? " done" : ""}"><b>${LS.ar(q.v)}</b><span>${LS.esc(q.text)}</span></div>`).join("")
      || `<div class="empty">مستنيين أول سؤال…</div>`;
    document.getElementById("tot").textContent = `عدد الأسئلة: ${LS.ar(qs.length)}`;
  },
};
const refresh = (s) => R2[s.type] && R2[s.type](s).catch(() => {});

async function refreshPoll(s) {
  const c = LS.tally(await LS.getResponses(s.id), s.options.length);
  const total = c.reduce((a, b) => a + b, 0), max = Math.max(1, ...c);
  c.forEach((v, i) => {
    const f = document.getElementById("f" + i), n = document.getElementById("n" + i);
    if (f) f.style.width = (v / max * 100) + "%";
    if (n) n.textContent = s.showPercent && total ? LS.ar(Math.round(v / total * 100)) + "٪" : LS.ar(v);
  });
  const t = document.getElementById("tot"); if (t) t.textContent = `عدد المشاركين: ${LS.ar(total)}`;
}

function show(i) {
  if (!deck || i === cur || i < 0 || i >= deck.slides.length) return;
  cur = i; const s = deck.slides[i];
  // data-type lets a theme style per slide type; s.el (optional) names a decorative element the theme can show
  // deck.elements: optional list the theme rotates through on plain content slides (one per slide)
  const nth = deck.slides.slice(0, i).filter((x) => x.type === "content" && !x.image && x.el === undefined).length;
  const auto = s.type === "content" && !s.image && Array.isArray(deck.elements) && deck.elements.length ? deck.elements[nth % deck.elements.length] : "";
  const el = s.el === false ? "" : (s.el || auto);
  // .pgn: small logo icon + slide number (themes hide it on cover/section/end)
  const pgn = deck.icon ? `<div class="pgn"><img src="${deck.icon}" alt=""><b>${LS.ar(i + 1)}</b></div>` : "";
  root.innerHTML = `<div class="slide" data-type="${s.type}${s.type === "content" && s.image ? "-img" : ""}"${el ? ` data-el="${LS.esc(el)}" style="--el:url('/themes/${deck.theme}/el/${LS.esc(el)}.svg')"` : ""}>${(R[s.type] || R.content)(s)}</div>
    ${pgn}<div class="meta"><span>${LS.esc(deck.footer || "")}</span><span>${LS.ar(i + 1)} / ${LS.ar(deck.slides.length)}</span></div>`;
  document.getElementById("tt").classList.toggle("cover", s.type === "title");
  after[s.type] && after[s.type](s);
  requestAnimationFrame(() => requestAnimationFrame(() => root.querySelector(".slide").classList.add("on")));
}

(async () => {
  deck = await LS.loadDeck();
  document.title = deck.title;
  show(await LS.getState());
  // talk timer: deck.duration seconds; counts down, then shows overtime
  let resync = null;
  if (deck.duration && deck.timer !== false) {
    const tt = document.getElementById("tt"), arc = document.getElementById("ttArc"), txt = document.getElementById("ttTxt");
    resync = LS.watchTimer((el, running) => {
      const left = deck.duration - el; tt.hidden = false;
      tt.classList.toggle("idle", !running && el === 0); tt.classList.toggle("warn", left <= 60 && left > 0); tt.classList.toggle("over", left <= 0);
      txt.textContent = (left < 0 ? "+" : "") + LS.clock(left);
      arc.style.strokeDashoffset = String(97.4 * Math.min(1, Math.max(0, el / deck.duration)));
    });
  }
  LS.subscribe({ onTimer: () => resync && resync(),
    onSlide: show,
    onResponse: (slideId) => { const s = deck.slides[cur]; if (!s || !slideId) return;
      if (s.type === "poll" && s.id === slideId) refreshPoll(s);
      else if (s.type === "compare" ? s.from.includes(slideId) : (slideId === s.id || slideId.startsWith(s.id + ":"))) refresh(s); },
  });
  // Keyboard control only if presenter key is in the URL
  if (LS.key) {
    document.getElementById("hint").textContent = "← → to navigate · F fullscreen";
    addEventListener("keydown", (e) => {
      if (["ArrowLeft", "PageDown", " "].includes(e.key)) LS.setSlide(Math.min(cur + 1, deck.slides.length - 1));
      if (["ArrowRight", "PageUp"].includes(e.key)) LS.setSlide(Math.max(cur - 1, 0));
      if (e.key.toLowerCase() === "f") document.documentElement.requestFullscreen?.();
    });
  }
})();
</script>
</body>
</html>
