<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
<!-- Papyrus tile (seamless): long horizontal strips dominate, faint cross-laid strips under them, warm blotches, fine grain -->
<filter id="h" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.0025 0.12" numOctaves="3" seed="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .38  0 0 0 0 .26  0 0 0 0 .12  0 0 0 .7 -.26"/></filter>
<filter id="v" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.09 0.003" numOctaves="2" seed="9" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .42  0 0 0 0 .30  0 0 0 0 .16  0 0 0 .22 -.08"/></filter>
<filter id="b" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="5" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .62  0 0 0 0 .45  0 0 0 0 .22  0 0 0 .6 -.24"/></filter>
<filter id="g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="1" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .30  0 0 0 0 .22  0 0 0 0 .14  0 0 0 .1 0"/></filter>
<rect width="480" height="480" fill="#F1E4C7"/>
